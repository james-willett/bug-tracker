name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write
  issues: write
  pull-requests: write

jobs:
  unit-tests-backend:
    runs-on: ubuntu-latest
    outputs:
      coverage_report: ${{ steps.tests_backend.outputs.coverage_report }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.21"
          cache-dependency-path: ./bugtracker-backend/go.sum

      - name: Install go-junit-report
        run: go install github.com/jstemmer/go-junit-report@latest

      - name: Execute Backend Unit Tests
        id: tests_backend
        working-directory: ./bugtracker-backend
        run: |

          go test -json -coverprofile=coverage.out -covermode=atomic ./... 
          go tool cover -func=coverage.out -o coverage.txt
          echo "## Go TestCoverage Report">> $GITHUB_STEP_SUMMARY
          echo "```">> $GITHUB_STEP_SUMMARY
          cat coverage.txt >> $GITHUB_STEP_SUMMARY
          echo "```">> $GITHUB_STEP_SUMMARY

          {
            echo "coverage_report<<EOF"
            cat coverage.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          go test -v ./... 2>&1 | go-junit-report > test-results.xml

      - name: Publish Backend Unit Test Results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Backend Unit Tests
          path: ./bugtracker-backend/test-results.xml
          reporter: java-junit

  unit-tests-frontend:
    needs: unit-tests-backend
    runs-on: ubuntu-latest
    outputs:
      coverage_report: ${{ steps.tests_frontend.outputs.coverage_report }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ./bugtracker-frontend/package-lock.json

      - name: Execute Frontend Unit Tests
        id: tests_frontend
        working-directory: ./bugtracker-frontend
        env:
          JEST_JUNIT_OUTPUT_DIR: .
          JEST_JUNIT_OUTPUT_NAME: test-results.xml
        run: |
          set +e

          {
            echo "Node version: $(node --version)"
            echo "npm version: $(npm --version)"
            echo
          } > full-test-output.txt

          npm ci 2>&1 | tee npm-ci-output.txt
          ci_exit=${PIPESTATUS[0]}
          test_exit=0
          if [ "$ci_exit" -ne 0 ]; then
            {
              echo "npm ci failed; Jest was not executed."
              echo
              cat npm-ci-output.txt
            } > full-test-output.txt
            cat > test-results.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="frontend setup" tests="1" failures="1" errors="0" skipped="0" time="0">
            <testsuite name="frontend setup" tests="1" failures="1" errors="0" skipped="0" time="0">
              <testcase classname="frontend setup" name="npm ci" time="0">
                <failure message="npm ci failed before Jest could run">See full-test-output.txt in the workflow logs.</failure>
              </testcase>
            </testsuite>
          </testsuites>
          EOF
            test_exit=$ci_exit
          else
            npm test -- --ci --watch=false --json --outputFile=jest-results.json 2>&1 | tee -a full-test-output.txt
            test_exit=${PIPESTATUS[0]}

            if [ -s jest-results.json ]; then
              node scripts/jest-json-to-junit.mjs jest-results.json test-results.xml 2>&1 | tee -a full-test-output.txt
            fi

            if [ ! -s test-results.xml ] || ! grep -q "<testcase" test-results.xml; then
              cat > test-results.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="frontend tests" tests="1" failures="1" errors="0" skipped="0" time="0">
            <testsuite name="frontend tests" tests="1" failures="1" errors="0" skipped="0" time="0">
              <testcase classname="frontend tests" name="jest results output" time="0">
                <failure message="Jest did not produce usable result files">See full-test-output.txt in the workflow logs.</failure>
              </testcase>
            </testsuite>
          </testsuites>
          EOF
              test_exit=1
            fi
          fi

          set -e

          {
            echo
            echo "Generated result files:"
            ls -la test-results.xml jest-results.json full-test-output.txt 2>&1 || true
          } >> full-test-output.txt

          echo "## Frontend Test Coverage Report">> $GITHUB_STEP_SUMMARY
          echo "```">> $GITHUB_STEP_SUMMARY
          cat full-test-output.txt >> $GITHUB_STEP_SUMMARY
          echo "```">> $GITHUB_STEP_SUMMARY

          {
            echo "coverage_report<<EOF"
            cat full-test-output.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          exit $test_exit

      - name: Ensure Frontend Test Results Exist
        if: ${{ !cancelled() }}
        run: |
          if [ ! -s ./bugtracker-frontend/test-results.xml ] || ! grep -q "<testcase" ./bugtracker-frontend/test-results.xml; then
            cat > ./bugtracker-frontend/test-results.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="frontend tests" tests="1" failures="1" errors="0" skipped="0" time="0">
            <testsuite name="frontend tests" tests="1" failures="1" errors="0" skipped="0" time="0">
              <testcase classname="frontend tests" name="missing junit report" time="0">
                <failure message="Frontend test-results.xml was not generated">A previous setup or test step failed before Jest could produce a JUnit report.</failure>
              </testcase>
            </testsuite>
          </testsuites>
          EOF
          fi
     
      - name: Publish Frontend Unit Test Results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Frontend Unit Tests
          path: ./bugtracker-frontend/test-results.xml
          reporter: jest-junit
          fail-on-empty: true

  create-coverage-comment:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [unit-tests-backend, unit-tests-frontend]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Create Test Coverage Comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Test Coverage Report

            ### Backend

            ```text
            ${{ needs['unit-tests-backend'].outputs.coverage_report }}
            ```

            ### Frontend

            ```text
            ${{ needs['unit-tests-frontend'].outputs.coverage_report }}
            ```
