name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit-tests-backend:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.test-backend.outputs.report }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
          cache: true
          cache-dependency-path: bugtracker-backend/go.sum
      
      - name: Install go-junit-report
        run: go install github.com/jstemmer/go-junit-report/v2@latest

      - name: Execute Backend Unit Tests
        id: test-backend
        working-directory: ./bugtracker-backend
        run: |
          go test -json -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out > coverage.txt

          echo "## Go Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat coverage.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT


          go test -v ./... 2>&1 | go-junit-report > test-results.xml

      - name: Publish Backend Test Result
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Backend Unit Tests Report
          path: bugtracker-backend/test-results.xml
          reporter: jest-junit

  unit-tests-frontend:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.test-frontend.outputs.report }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bugtracker-frontend/package-lock.json

      - name: Execute Frontend Unit Tests
        id: test-frontend
        working-directory: ./bugtracker-frontend
        run: |
          npm ci
          npm test | tee full_output.txt

          echo "## Frontend Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat full_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat full_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Publish Frontend Test Results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Frontend Unit Tests Report
          path: bugtracker-frontend/test-results.xml
          reporter: jest-junit

  create-coverage-comments:
    if: github.event_name == 'pull_request'
    needs: [unit-tests-backend, unit-tests-frontend]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Create Backend Coverage Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Backend Test Coverage Report
            ```
            ${{ needs.unit-tests-backend.outputs.coverage }}
            ```

      - name: Create Frontend Coverage Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Frontend Test Coverage Report
            ```
            ${{ needs.unit-tests-frontend.outputs.coverage }}
            ```
  api-e2e-perf-tests:
    runs-on: ubuntu-latest
    needs: [unit-tests-backend,unit-tests-frontend]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Launch Application
        run: |
          docker compose up --build -d
          npx wait-port http://localhost:8080/api/health -t 30000

      - name: Execute API Tests
        working-directory: ./tests-api
        run: |
          npm ci
          npx playwright test
    
      - name: Run E2E Tests
        working-directory: ./tests-e2e
        env:
          CI: "1"
        run: |
          npm ci
          npx playwright install
          npx playwright test
      
      - name: Setup K6
        uses: grafana/setup-k6-action@v1

      - name: Run Performance Test
        uses: grafana/run-k6-action@v1
        with:
          path: test-perf/script.js
          flags: --out json=summary.json
          
      - name: Stop Application
        if: always()
        run: docker compose down

      - name: Publish API Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-tests-results
          path: ./tests-api/test-results/
          retention-days: 30
      
      - name: Publish API Test playwright-report
        uses: actions/upload-artifact@v4
        if: always()
        with: 
          name: api-tests-playwright-report
          path: ./tests-api/playwright-report/
          retention-days: 30
      
      - name: Publish E2E Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: ./tests-e2e/test-results/
          retention-days: 30 

      - name: Publish E2E Test playwright-report
        uses: actions/upload-artifact@v4
        if: always()
        with: 
          name: e2e-tests-playwright-report
          path: ./tests-e2e/playwright-report/
          retention-days: 30
      
      - name: Publish Performance Raw Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-raw-results
          path: ./tests-perf/summary.json
          retention-days: 30
      
      - name: Publish Performance HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: ./tests-perf/perf-results.html
          retention-days: 30

      - name: Publish API Test Report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: API Tests Report
          path: ./tests-api/test-results/*.xml
          reporter: jest-junit
          report-title: "🔵 API Tests"
          only-summary: true
      
      - name: Publish e2e Test Report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: E2E Tests Report
          path: ./tests-e2e/test-results/results.xml
          reporter: jest-junit
          report-title: "🟢 E2E Tests"
          only-summary: true
      

           