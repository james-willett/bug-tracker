name: CI
on:
    push:
        branches:
            - main
    workflow_dispatch:
jobs:
    unit-test-backend:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.21"
                  cache-dependency-path: ./bugtracker-backend/go.sum
            
            - name: Install go-junit-report
              run: go install github.com/jstemmer/go-junit-report/v2@latest
            
            - name: Execute unit tests for backend
              working-directory: ./bugtracker-backend
              run: |
               go test -v ./... | go-junit-report > test-results.xml

            - name: Upload test results backend
              uses: dorny/test-reporter@v1
              if: always()
              with:
                  name: Backend Unit Tests report
                  path: ./bugtracker-backend/test-results.xml
                  reporter: jest-junit

            

    
    unit-test-frontend:
        needs: unit-test-backend
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: ./bugtracker-frontend/package-lock.json

            
            - name: Execute unit tests for frontend
              working-directory: ./bugtracker-frontend
              run: |
               npm ci
               npm test | tee full_output.txt

               echo"## Frontend Unit Test Coverage">>$GITHUB_STEP_SUMMARY"
               echo"'''">>$GITHUB_STEP_SUMMARY
               cat full_output.txt >>$GITHUB_STEP_SUMMARY
               echo"'''">>$GITHUB_STEP_SUMMARY

            
            - name: Upload test results
              uses: dorny/test-reporter@v1
              if: always()
              with:
                  name: Frontend Unit Tests report
                  path: ./bugtracker-frontend/test-results.xml
                  reporter: jest-junit

    